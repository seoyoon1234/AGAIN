<script>
(() => {
  const root = document.getElementById('again-map-first');
  const panel = root.querySelector('#am-panel');
  const status = root.querySelector('#am-status');
  const searchText = root.querySelector('#am-search-text');
  const routeLine = root.querySelector('#am-route-line');
  const fallbackPlaces = [{id:'n-seoul-tower',label:'A',name:'N Seoul Tower',tag:'Skyline · sunset',category:'scenic',latitude:37.55117,longitude:126.98823,extra:8,description:'A panoramic Seoul viewpoint.',voiceCaption:'Watch Seoul change from daylight to city lights.',bestTime:'Before sunset',hours:{summary:'Verify current hours before visiting',note:''},cost:{currency:'KRW',adult:29000,note:'Observatory ticket'},source:{label:'Official visitor information',url:'https://www.nseoultower.co.kr/eng/visit/use.asp',verifiedAt:'2026-11-21'}}];
  const placeList = Array.isArray(window.AGAIN_PLACES) && window.AGAIN_PLACES.length ? window.AGAIN_PLACES : fallbackPlaces;
  const frames = Object.fromEntries(placeList.map(place => [place.id, place]));
  const firstPlace = placeList[0];
  const state = { view:'explore', selected:firstPlace.id, saved:[], filter:'scenic', route:'frame', destination:firstPlace.name, playing:false, progress:0, captions:true, soundscape:false, guide:true, voiceListening:false };
  let audioTimer = null;
  let map = null;
  let currentMarker = null;
  const mapMarkers = new Map();
  const icon = n => '<i data-lucide="'+n+'" aria-hidden="true"></i>';
  const thumbClass = f => 'am-t'+((placeList.indexOf(f)%3)+1);
  const money = amount => amount == null || !Number.isFinite(Number(amount)) ? 'Check price' : Number(amount) === 0 ? 'Free' : '₩'+Number(amount).toLocaleString('en-US');
  const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const visiblePlaces = () => state.filter==='surprise' ? placeList : placeList.filter(place => place.category===state.filter);
  const card = f => '<button type="button" class="am-card cursor-interaction" data-action="frame" data-id="'+f.id+'"><span class="am-thumb '+thumbClass(f)+'"><span class="am-badge">+'+f.extra+' min</span><span class="am-audio-dot">'+icon('headphones')+'</span></span><strong>'+f.name+'</strong><small>'+f.tag+'</small></button>';
  const handle = '<div class="am-handle" aria-hidden="true"></div>';
  function explore(){
    const shown=visiblePlaces();
    return handle+'<div class="am-panel-head am-discover-head"><div><div class="am-eyebrow">AGAIN · SEE IT. HEAR IT. FIND IT.</div><h2>Scenes along your way</h2><p>Verified places and viewpoints in Seoul</p></div><img class="am-mini-mascot" src="/brand/again-mascot.png" alt="AGAIN travel mascot" width="64" height="60" loading="lazy"><button type="button" class="am-pill cursor-interaction" data-action="time">+15 min</button></div><div class="am-cards">'+shown.map(card).join('')+'</div>';
  }
  function detail(){
    const f=frames[state.selected], saved=state.saved.includes(f.id);
    const pct=Math.round(state.progress/24*100), elapsed='0:'+String(state.progress).padStart(2,'0');
    const source=f.source||{}, cost=f.cost||{adult:0,note:'Cost information needs verification.'}, hours=f.hours||{summary:'Hours need verification.',note:''};
    return handle+
      '<div class="am-detail-hero '+thumbClass(f)+'"><button type="button" class="am-close cursor-interaction" data-action="close" aria-label="Close details">'+icon('x')+'</button></div>'+
      '<div class="am-detail-title"><div><h2>'+f.name+'</h2><p>Hidden Frame · '+f.tag+'</p></div><button type="button" class="am-save cursor-interaction '+(saved?'is-saved':'')+'" data-action="save" data-id="'+f.id+'" aria-label="'+(saved?'Remove from saved':'Save scene')+'">'+icon(saved?'bookmark-check':'bookmark')+'</button></div>'+
      '<div class="am-meta"><span>+'+f.extra+' min walk</span><span>'+f.bestTime+'</span><span>Verified '+source.verifiedAt+'</span></div>'+
      '<div class="am-audio"><button type="button" class="am-play cursor-interaction" data-action="play" aria-label="'+(state.playing?'Pause':'Play')+' Hidden Frame Voice">'+icon(state.playing?'pause':'play')+'</button><div class="am-audio-copy"><strong>Hidden Frame Voice</strong><small>AI voice demo · '+elapsed+' / 0:24</small><div class="am-progress" role="progressbar" aria-label="Voice story progress" aria-valuemin="0" aria-valuemax="24" aria-valuenow="'+state.progress+'"><span style="width:'+pct+'%"></span></div></div><button type="button" class="am-cc cursor-interaction" data-action="captions" aria-pressed="'+state.captions+'" aria-label="Toggle captions">CC</button></div>'+
      (state.captions?'<p class="am-caption">“'+f.voiceCaption+'”</p>':'')+
      '<div class="am-cost"><div class="am-cost-head"><strong>Total Cost Preview</strong><b>'+money(cost.adult)+'</b></div><p>'+cost.note+'</p></div>'+
      '<div class="am-info-grid"><div class="am-info-row">'+icon('clock-3')+'<div><strong>Operating information</strong><small>'+hours.summary+'. '+(hours.note||'')+'</small></div></div><div class="am-info-row">'+icon('circle-help')+'<div><strong>Local Helper</strong><small>'+(f.localHelper||'Local guidance is being verified.')+'</small></div></div><div class="am-info-row">'+icon('accessibility')+'<div><strong>Accessibility</strong><small>'+(f.accessibility||'Accessibility information is being verified.')+'</small></div></div></div>'+
      '<div class="am-soundscape">'+icon('audio-lines')+'<div><strong>Soundscape preview</strong><small>AI-generated ambience · not a field recording</small></div><button type="button" class="am-sound-button cursor-interaction" data-action="soundscape" aria-pressed="'+state.soundscape+'" aria-label="Toggle soundscape">'+icon(state.soundscape?'volume-2':'volume-1')+'</button></div>'+
      '<p>'+f.description+'</p><div class="am-source"><span>Last checked '+source.verifiedAt+'</span><a href="'+source.url+'" target="_blank" rel="noreferrer">Official source</a></div>'+
      '<div class="am-actions"><button type="button" class="am-button cursor-interaction" data-action="close">Keep browsing</button><button type="button" class="am-button am-primary cursor-interaction" data-action="add">'+icon('route')+'Add to route</button></div>';
  }
  function search(){
    return handle+'<div class="am-panel-head am-helper-head"><img class="am-helper-mascot" src="/brand/again-listen.png" alt="AGAIN listening companion" width="72" height="58"><div><div class="am-eyebrow">ASK AGAIN</div><h2>Plan a route</h2><p>Type or say a destination in your own language.</p></div></div><form id="am-route-form" class="am-search-panel"><label class="am-field"><span></span><input name="from" value="Myeongdong Station" aria-label="Starting point"></label><label class="am-field am-dest"><span></span><input name="to" value="'+escapeHTML(state.destination)+'" aria-label="Destination"></label><button type="button" class="am-button '+(state.voiceListening?'am-voice-listening':'')+' cursor-interaction" data-action="voice">'+icon(state.voiceListening?'audio-lines':'mic')+(state.voiceListening?'Listening…':'Search by voice')+'</button><button type="submit" class="am-button am-primary cursor-interaction">Find scenes on this route</button></form>';
  }
  function route(){
    const f=frames[state.selected], via=state.route==='frame';
    return handle+'<div class="am-panel-head am-helper-head"><img class="am-helper-mascot" src="/brand/again-navigate.png" alt="AGAIN navigating companion" width="72" height="58"><div><h2>Choose your way</h2><p>Myeongdong Station → '+state.destination+'</p></div></div><div class="am-route-compare"><button type="button" class="am-route-option cursor-interaction '+(!via?'is-active':'')+'" data-action="route-mode" data-mode="direct"><small>Direct</small><strong>24 min</strong><small>Fastest route</small></button><button type="button" class="am-route-option cursor-interaction '+(via?'is-active':'')+'" data-action="route-mode" data-mode="frame"><small>Via Hidden Frame</small><strong>'+(24+f.extra)+' min</strong><small>+'+f.extra+' min walking</small></button></div>'+(via?'<div class="am-route-summary">'+icon('camera')+'<div><strong>'+f.name+'</strong><small>'+money(f.cost?.adult||0)+' · '+f.hours?.summary+'</small></div><button type="button" class="am-save cursor-interaction '+(state.saved.includes(f.id)?'is-saved':'')+'" data-action="save" data-id="'+f.id+'" aria-label="Save frame">'+icon(state.saved.includes(f.id)?'bookmark-check':'bookmark')+'</button></div>':'')+'<div class="am-guide">'+icon('headphones')+'<div><strong>Smart Voice Guide</strong><small>Confirmed stops, exits and walking turns only</small></div><button type="button" class="am-switch cursor-interaction" data-action="guide" aria-pressed="'+state.guide+'" aria-label="Toggle smart voice guide"><span></span></button></div><div class="am-actions"><button type="button" class="am-button cursor-interaction" data-action="explore">Back</button><button type="button" class="am-button am-primary cursor-interaction" data-action="directions">'+icon('navigation')+'Start directions</button></div>';
  }
  function saved(){
    const items=state.saved.map(id=>frames[id]);
    return handle+'<div class="am-panel-head"><div><h2>Saved scenes</h2><p>Stored on this device — no account needed.</p></div></div>'+(items.length?'<div class="am-list">'+items.map(f=>'<div class="am-saved-row"><span class="am-thumb '+thumbClass(f)+'"></span><div><strong>'+f.name+'</strong><small>'+f.tag+' · '+money(f.cost?.adult||0)+'</small></div><button type="button" class="cursor-interaction" data-action="remove" data-id="'+f.id+'" aria-label="Remove '+f.name+'">'+icon('x')+'</button></div>').join('')+'</div>':'<div class="am-empty"><img class="am-empty-mascot" src="/brand/again-remember.png" alt="AGAIN memory companion" width="105" height="90"><h2>No saved scenes yet</h2><p>Save a frame and come back to it anytime.</p><div class="am-actions"><span></span><button type="button" class="am-button am-primary cursor-interaction" data-action="explore">Explore map</button></div></div>');
  }
  function render(){
    panel.innerHTML=state.view==='explore'?explore():state.view==='detail'?detail():state.view==='search'?search():state.view==='route'?route():saved();
    searchText.textContent=state.destination || 'Where do you want to go?';
    routeLine.hidden=state.view!=='route';
    root.querySelector('#am-saved-count').textContent=state.saved.length||'';
    root.querySelectorAll('.am-nav button').forEach(b=>b.classList.toggle('is-active',(state.view==='saved'&&b.dataset.action==='saved')||(state.view==='route'&&b.dataset.action==='route')||(['explore','detail','search'].includes(state.view)&&b.dataset.action==='explore')));
    root.querySelectorAll('.am-chips button').forEach(b=>b.classList.toggle('is-active',b.dataset.filter===state.filter));
    if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:18,height:18}});
    updateMapMarkers();
  }
  function initMap(){
    if(!globalThis.L){status.textContent='Map tiles are unavailable. Place details still work offline.';return;}
    map=L.map('am-leaflet-map',{zoomControl:false,attributionControl:true}).setView([37.5665,126.9780],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
    placeList.forEach(place=>{
      const marker=L.marker([place.latitude,place.longitude],{icon:L.divIcon({className:'am-leaflet-pin',html:'<span>'+place.label+'</span>',iconSize:[40,47],iconAnchor:[20,43]})});
      marker.bindPopup('<strong>'+escapeHTML(place.name)+'</strong>'+escapeHTML(place.tag)+' · '+money(place.cost?.adult));
      marker.on('click',()=>{state.selected=place.id;state.view='detail';render();persist();});
      mapMarkers.set(place.id,marker);
    });
    updateMapMarkers();
  }
  function updateMapMarkers(){
    if(!map)return;
    const allowed=new Set(visiblePlaces().map(place=>place.id));
    mapMarkers.forEach((marker,id)=>{
      if(allowed.has(id)){if(!map.hasLayer(marker))marker.addTo(map);}else if(map.hasLayer(marker))map.removeLayer(marker);
      const selected=id===state.selected;
      const el=marker.getElement();if(el)el.classList.toggle('is-selected',selected);
    });
  }
  function syncAudio(){
    if(!state.playing){if(audioTimer){clearInterval(audioTimer);audioTimer=null;}return;}
    if(audioTimer)return;
    audioTimer=setInterval(()=>{if(!state.playing||state.view!=='detail'){state.playing=false;syncAudio();return;}state.progress+=1;if(state.progress>=24){state.progress=0;state.playing=false;}render();if(!state.playing)syncAudio();},1000);
  }
  function persist(){
    const snapshot={saved:state.saved,filter:state.filter,selected:state.selected,guide:state.guide,captions:state.captions};
    try{localStorage.setItem('again-state-v1',JSON.stringify(snapshot));}catch{}
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{view:state.view,selectedFrame:frames[state.selected].name,savedCount:state.saved.length,routeMode:state.route},privateContent:state}).catch(()=>{});
  }
  function startVoiceSearch(){
    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    state.view='search';
    if(!Recognition){state.voiceListening=false;status.textContent='Voice recognition is not available in this browser. Type your destination instead.';render();return;}
    const recognition=new Recognition();
    recognition.lang=navigator.language||'en-US';recognition.interimResults=false;recognition.maxAlternatives=1;
    state.voiceListening=true;render();status.textContent='Listening in '+recognition.lang+'…';
    recognition.onresult=event=>{
      const transcript=event.results[0][0].transcript.trim();
      const lower=transcript.toLowerCase();
      const matched=placeList.find(place=>lower.includes(place.name.toLowerCase().replace(' village','')))||
        (lower.includes('sunset')?frames['n-seoul-tower']:lower.includes('hanok')?frames['bukchon-hanok-village']:lower.includes('stream')?frames['cheonggyecheon-stream']:null);
      if(matched){state.selected=matched.id;state.destination=matched.name;state.view='explore';map?.setView([matched.latitude,matched.longitude],15);status.textContent='Voice result: '+matched.name+'. Showing verified details and nearby frames.';}
      else{state.destination=transcript;state.view='search';status.textContent='Voice captured. Confirm or edit the destination.';}
      state.voiceListening=false;render();persist();
    };
    recognition.onerror=()=>{state.voiceListening=false;status.textContent='Voice search could not start. Type your destination instead.';render();};
    recognition.onend=()=>{if(state.voiceListening){state.voiceListening=false;render();}};
    recognition.start();
  }
  function act(action,el){
    status.textContent='';
    if(action==='frame'){state.selected=el.dataset.id;state.view='detail';}
    else if(action==='close'||action==='explore'){state.view='explore';}
    else if(action==='search'){state.view='search';}
    else if(action==='route'){state.view='route';}
    else if(action==='saved'){state.view='saved';}
    else if(action==='add'){state.route='frame';state.view='route';}
    else if(action==='route-mode'){state.route=el.dataset.mode;}
    else if(action==='filter'){state.filter=el.dataset.filter;status.textContent='Map markers updated for '+el.textContent.trim()+'.';}
    else if(action==='save'){const id=el.dataset.id;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];status.textContent=state.saved.includes(id)?'Scene saved on this device.':'Scene removed.';}
    else if(action==='remove'){state.saved=state.saved.filter(x=>x!==el.dataset.id);status.textContent='Scene removed.';}
    else if(action==='directions'){const f=frames[state.selected];window.open('https://www.google.com/maps/dir/?api=1&destination='+f.latitude+','+f.longitude,'_blank','noopener');status.textContent='Opening directions to '+f.name+'.';}
    else if(action==='location'){if(!map){status.textContent='Map is unavailable while map scripts are offline.';}else if(!navigator.geolocation){status.textContent='Location is unavailable in this browser.';}else navigator.geolocation.getCurrentPosition(pos=>{const point=[pos.coords.latitude,pos.coords.longitude];map?.setView(point,15);if(currentMarker)currentMarker.remove();currentMarker=L.circleMarker(point,{radius:8,color:'#fff',weight:4,fillColor:'#86C5FF',fillOpacity:1}).addTo(map);status.textContent='Map centered on your current location.';},()=>{status.textContent='Location permission was not granted.';});}
    else if(action==='layers'){status.textContent='Map layer menu would open here.';}
    else if(action==='time'){status.textContent='Showing scenes within 15 extra minutes.';}
    else if(action==='play'){state.playing=!state.playing;if(state.progress>=24)state.progress=0;status.textContent=state.playing?'Demo playback progress only — ElevenLabs audio is not yet connected.':'Demo playback paused.';}
    else if(action==='captions'){state.captions=!state.captions;}
    else if(action==='soundscape'){state.soundscape=!state.soundscape;status.textContent='Soundscape is a UI preview. No audio asset is connected yet.';}
    else if(action==='guide'){state.guide=!state.guide;status.textContent=state.guide?'Smart Voice Guide enabled.':'Smart Voice Guide disabled.';}
    else if(action==='voice'){startVoiceSearch();return;}
    render();syncAudio();persist();
  }
  root.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&root.contains(b)&&b.dataset.action)act(b.dataset.action,b);});
  root.addEventListener('submit',e=>{if(e.target.id!=='am-route-form')return;e.preventDefault();const data=new FormData(e.target);state.destination=String(data.get('to')||'N Seoul Tower').trim()||'N Seoul Tower';state.view='explore';status.textContent='Showing Hidden Frames along your route.';render();persist();});
  try{const local=JSON.parse(localStorage.getItem('again-state-v1')||'null');if(local&&typeof local==='object')Object.assign(state,local);}catch{}
  state.saved=Array.isArray(state.saved)?state.saved.filter(id=>frames[id]):[];
  if(!frames[state.selected])state.selected=firstPlace.id;
  const savedState=window.openai?.widgetState?.privateContent;if(savedState&&typeof savedState==='object')Object.assign(state,savedState);
  state.saved=Array.isArray(state.saved)?state.saved.filter(id=>frames[id]):[];
  if(!frames[state.selected])state.selected=firstPlace.id;
  if(!['explore','detail','search','route','saved'].includes(state.view))state.view='explore';
  window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&typeof s==='object'){Object.assign(state,s);render();}});
  render();
  initMap();
})();
</script>
